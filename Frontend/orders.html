
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Orders | Sproutly</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        body {
            background: #F7F6EF;
        }

        .orders-page {
            max-width: 1000px;
            margin: 50px auto;
            padding: 20px;
        }

        .orders-page h1 {
            color: #315B43;
            text-align: center;
            margin-bottom: 10px;
            font-size: 34px;
        }

        .orders-subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 35px;
        }

        /* ORDER CARD */

        .order-card {
            background: #fff;
            border: 1px solid #DDE8D7;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 22px;
            box-shadow: 0 8px 25px rgba(49, 91, 67, 0.07);
            transition: 0.2s;
        }

        .order-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(49, 91, 67, 0.10);
        }

        /* TOP */

        .order-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;

            border-bottom: 1px solid #eee;

            padding-bottom: 15px;
            margin-bottom: 18px;
        }

        .order-id {
            color: #315B43;
            font-weight: bold;
            font-size: 16px;
        }

        .order-status {
            background: #DDE8D7;
            color: #315B43;
            padding: 7px 13px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        /* DETAILS */

        .order-details {
            background: #FBFBF7;
            padding: 15px 18px;
            border-radius: 13px;
        }

        .order-details p {
            margin: 9px 0;
            color: #555;
            font-size: 14px;
        }

        .order-details strong {
            color: #315B43;
        }

        /* ITEMS */

        .order-items {
            background: #F7F6EF;
            padding: 18px;
            border-radius: 13px;
            margin: 18px 0;
        }

        .order-items h3 {
            margin-top: 0;
            color: #315B43;
            font-size: 17px;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 9px 0;
            border-bottom: 1px solid #E6E8DF;
            color: #555;
            font-size: 14px;
        }

        .item-row:last-child {
            border-bottom: none;
        }

        .item-name {
            color: #315B43;
            font-weight: 600;
        }

        /* TOTAL */

        .order-total {
            color: #315B43;
            font-size: 21px;
            font-weight: bold;
            text-align: right;
            margin-bottom: 0;
        }

        /* EMPTY */

        .empty-orders {
            text-align: center;
            background: white;
            padding: 50px 20px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(49, 91, 67, 0.06);
        }

        .empty-orders h2 {
            color: #315B43;
        }

        .empty-orders p {
            color: #777;
        }

        .empty-orders a {
            display: inline-block;
            margin-top: 15px;
            background: #315B43;
            color: white;
            padding: 12px 22px;
            border-radius: 10px;
            text-decoration: none;
        }

        .empty-orders a:hover {
            background: #244B38;
        }

        /* LOADING */

        .loading-orders {
            text-align: center;
            color: #777;
            padding: 40px;
        }

        .error-orders {
            text-align: center;
            background: white;
            padding: 35px 20px;
            border-radius: 18px;
            color: #777;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .orders-page {
                margin: 30px auto;
                padding: 15px;
            }

            .orders-page h1 {
                font-size: 28px;
            }

            .order-card {
                padding: 18px;
            }

            .item-row {
                flex-direction: column;
                gap: 4px;
            }

        }

    </style>

</head>


<body>


    <main class="orders-page">

        <h1>My Orders 🌿</h1>

        <p class="orders-subtitle">
            Your little garden's order history.
        </p>


        <div id="ordersContainer">

            <div class="loading-orders">
                🌱 Loading your orders...
            </div>

        </div>

    </main>



    <script>

        /* =====================================
           BACKEND CONNECTION
        ===================================== */

        
        const API_BASE = "https://sproutly-production-6c2d.up.railway.app";
        const ordersContainer =
            document.getElementById("ordersContainer");



        /* =====================================
           LOAD ORDERS FROM DATABASE
        ===================================== */

        async function loadOrders() {

            try {

                const response =
                    await fetch(`${API_BASE}/api/orders`);


                if (!response.ok) {

                    throw new Error(
                        "Unable to fetch orders"
                    );

                }


                const data =
                    await response.json();


                /*
                 * Support both:
                 * [] 
                 * { orders: [] }
                 */

                const orders =
                    Array.isArray(data)
                        ? data
                        : (data.orders || []);



                /* =================================
                   NO ORDERS
                ================================= */

                if (orders.length === 0) {

                    ordersContainer.innerHTML = `

                        <div class="empty-orders">

                            <h2>
                                No Orders Yet 🌱
                            </h2>

                            <p>
                                Your plant orders will appear here.
                            </p>

                            <a href="plants.html">
                                Explore Plants
                            </a>

                        </div>

                    `;

                    return;

                }



                /* =================================
                   SORT LATEST ORDER FIRST
                ================================= */

                const sortedOrders =
                    [...orders].sort(
                        (a, b) => {

                            const idA =
                                Number(
                                    a.order_id ??
                                    a.orderId ??
                                    0
                                );

                            const idB =
                                Number(
                                    b.order_id ??
                                    b.orderId ??
                                    0
                                );

                            return idB - idA;

                        }
                    );



                ordersContainer.innerHTML = "";



                /* =================================
                   DISPLAY ORDERS
                ================================= */

                sortedOrders.forEach(order => {


                    /*
                     * DATABASE FIELD NAMES
                     */

                    const orderId =
                        order.order_id ??
                        order.orderId ??
                        "N/A";


                    const customerName =
                        order.customer_name ??
                        order.customerName ??
                        "Customer";


                    const mobile =
                        order.mobile ??
                        order.customer_phone ??
                        order.customerPhone ??
                        "Not provided";


                    const address =
                        order.address ??
                        order.customer_address ??
                        order.customerAddress ??
                        "Not provided";


                    const total =
                        Number(
                            order.total_amount ??
                            order.total ??
                            0
                        );



                    /*
                     * DATE
                     */

                    let orderDate = "Not available";


                    if (
                        order.order_date ||
                        order.date
                    ) {

                        const dateValue =
                            order.order_date ||
                            order.date;


                        const parsedDate =
                            new Date(dateValue);


                        if (
                            !isNaN(
                                parsedDate.getTime()
                            )
                        ) {

                            orderDate =
                                parsedDate.toLocaleString(
                                    "en-IN",
                                    {
                                        day: "2-digit",
                                        month: "short",
                                        year: "numeric",
                                        hour: "2-digit",
                                        minute: "2-digit"
                                    }
                                );

                        } else {

                            orderDate = dateValue;

                        }

                    }



                    /* =================================
                       ORDER ITEMS
                    ================================= */

                    const items =
                        order.items ||
                        order.order_items ||
                        [];



                    let itemsHTML = "";



                    if (
                        Array.isArray(items) &&
                        items.length > 0
                    ) {

                        items.forEach(item => {

                            const itemName =
                                item.plant_name ??
                                item.name ??
                                "Plant";


                            const quantity =
                                Number(
                                    item.quantity || 0
                                );


                            const price =
                                Number(
                                    item.unit_price ??
                                    item.price ??
                                    0
                                );


                            const subtotal =
                                Number(
                                    item.subtotal ??
                                    (price * quantity)
                                );


                            itemsHTML += `

                                <div class="item-row">

                                    <span class="item-name">

                                        🌿 ${itemName}
                                        × ${quantity}

                                    </span>

                                    <span>

                                        ₹${subtotal.toLocaleString("en-IN")}

                                    </span>

                                </div>

                            `;

                        });

                    }
                    else {

                        itemsHTML = `

                            <div class="item-row">

                                <span>
                                    🌿 Order items
                                </span>

                                <span>
                                    ₹${total.toLocaleString("en-IN")}
                                </span>

                            </div>

                        `;

                    }



                    /* =================================
                       CREATE ORDER CARD
                    ================================= */

                    const orderCard =
                        document.createElement("div");


                    orderCard.className =
                        "order-card";


                    orderCard.innerHTML = `

                        <div class="order-top">

                            <span class="order-id">

                                Order ID: #${orderId}

                            </span>


                            <span class="order-status">

                                ✓ Order Placed

                            </span>

                        </div>


                        <div class="order-details">

                            <p>
                                <strong>📅 Date:</strong>
                                ${orderDate}
                            </p>

                            <p>
                                <strong>👤 Name:</strong>
                                ${customerName}
                            </p>

                            <p>
                                <strong>📱 Mobile:</strong>
                                ${mobile}
                            </p>

                            <p>
                                <strong>📍 Address:</strong>
                                ${address}
                            </p>

                        </div>


                        <div class="order-items">

                            <h3>
                                🌱 Ordered Plants
                            </h3>

                            ${itemsHTML}

                        </div>


                        <p class="order-total">

                            Total:
                            ₹${total.toLocaleString("en-IN")}

                        </p>

                    `;


                    ordersContainer.appendChild(
                        orderCard
                    );

                });


            }
            catch (error) {

                console.error(
                    "Orders page error:",
                    error
                );


                ordersContainer.innerHTML = `

                    <div class="error-orders">

                        <h2>
                            ⚠️ Unable to load orders
                        </h2>

                        <p>
                            Please make sure the
                            Sproutly backend server
                            is running.
                        </p>

                        <a href="plants.html">
                            Back to Plants
                        </a>

                    </div>

                `;

            }

        }



        /* =====================================
           START
        ===================================== */

        loadOrders();

    </script>


</body>

</html>
